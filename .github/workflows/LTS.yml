name: LTS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target CPU architecture'
        required: false
        default: 'MZEN3'
        type: choice
        options:
          - MZEN3
          - GENERIC_CPU3
          - GENERIC_CPU2
          - MSKYLAKE

jobs:
  build-lts:
    permissions:
      contents: write
    uses: ./.github/workflows/build-core.yml
    with:
      branch: LTS
      version_suffix: lts
      arch: ${{ inputs.arch || 'MZEN3' }}